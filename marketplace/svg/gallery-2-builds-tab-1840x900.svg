<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="900" viewBox="0 0 1840 900"><defs>
  <filter id="shadow-lg" x="-15%" y="-15%" width="130%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#172b4d" flood-opacity="0.16"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172b4d" flood-opacity="0.12"/>
  </filter>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7f9fd"/>
    <stop offset="1" stop-color="#e9eff9"/>
  </linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0e1a33"/>
    <stop offset="1" stop-color="#1a2c55"/>
  </linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#ffe9d6"/>
  </linearGradient>
  <radialGradient id="glow-orange">
    <stop offset="0" stop-color="#ff6600" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-blue">
    <stop offset="0" stop-color="#0c66e4" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#0c66e4" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#c4cde0"/>
  </pattern>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1 1 L9 5 L1 9 z" fill="#5b6b86"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1 1 L9 5 L1 9 z" fill="#ff6600"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1 1 L9 5 L1 9 z" fill="#0c66e4"/>
  </marker>
</defs><rect x="0" y="0" width="1840" height="900" fill="url(#canvas)"/><rect x="0" y="0" width="1840" height="900" fill="url(#dots)" opacity="0.55"/><circle cx="184" cy="108" r="420" fill="url(#glow-orange)" /><circle cx="1692.8000000000002" cy="855" r="460" fill="url(#glow-blue)" /><rect x="170" y="56" width="1500" height="788" rx="18" fill="#ffffff" stroke="#dfe3ec" stroke-width="1" filter="url(#shadow-lg)"/><clipPath id="builds-window"><rect x="170" y="56" width="1500" height="788" rx="18"/></clipPath><g clip-path="url(#builds-window)"><rect x="170" y="56" width="1500" height="52" fill="#f4f6fa"/><line x1="170" y1="108" x2="1670" y2="108" stroke="#dfe3ec" stroke-width="1" /><circle cx="198" cy="82" r="7" fill="#ff5f57" /><circle cx="222" cy="82" r="7" fill="#febc2e" /><circle cx="246" cy="82" r="7" fill="#28c840" /><rect x="280" y="67" width="1280" height="30" rx="15" fill="#ffffff" stroke="#dfe3ec" stroke-width="1"/><g transform="translate(298 74) scale(0.625)" fill="none" stroke="#8c9bb5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="324" y="87" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5b6b86" text-anchor="start">Settings › Apps › Forgejo for Jira</text><text x="218" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d" text-anchor="start">Forgejo for Jira</text><text x="218" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6b86" text-anchor="start">Connect to Forgejo</text><text x="406" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6b86" text-anchor="start">Repositories</text><text x="542" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0c66e4" text-anchor="start">Builds &amp; deployments</text><rect x="542" y="239" width="186" height="4" fill="#0c66e4"/><line x1="170" y1="242" x2="1670" y2="242" stroke="#dfe3ec" stroke-width="1" /><text x="218" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#172b4d" text-anchor="start">Builds and deployments</text><rect x="218" y="318" width="640" height="96" rx="10" fill="#dcfff1"/><g transform="translate(242 344) scale(1.4166666666666667)" fill="none" stroke="#1f845a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></g><text x="296" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#172b4d" text-anchor="start">Builds need no setup</text><text x="296" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6b86" text-anchor="start">Forgejo Actions runs appear on your issues as builds.</text><text x="218" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#172b4d" text-anchor="start">Workflows not reported as builds</text><rect x="218" y="490" width="640" height="42" rx="6" fill="#ffffff" stroke="#b9c2d3" stroke-width="1.5"/><text x="232" y="517" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#172b4d" text-anchor="start">deploy.yml, release.yml</text><text x="218" y="562" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6b86" text-anchor="start">Comma-separated workflow file names. A workflow that reports its</text><text x="218" y="584" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6b86" text-anchor="start">own deployment belongs here, or the run is also shown as a build.</text><rect x="218" y="604" width="84" height="40" rx="6" fill="#f1f2f4"/><text x="260" y="629.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#172b4d" text-anchor="middle">Save</text><line x1="218" y1="680" x2="858" y2="680" stroke="#eef1f6" stroke-width="1" /><text x="218" y="722" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#172b4d" text-anchor="start">Deployments and feature flags</text><text x="218" y="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6b86" text-anchor="start">Add one workflow file to report them from Forgejo Actions.</text><rect x="218" y="770" width="190" height="40" rx="6" fill="#0c66e4"/><text x="313" y="795.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Show workflow file</text></g><rect x="940" y="130" width="680" height="660" rx="16" fill="#ffffff" stroke="#dfe3ec" stroke-width="1" filter="url(#shadow-lg)"/><text x="972" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#172b4d" text-anchor="start">Report deployments to Jira</text><text x="972" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#172b4d" text-anchor="start">1.  In your Forgejo repository, open Settings → Actions → Secrets</text><text x="972" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#172b4d" text-anchor="start">and add a secret named JIRA_FORGEJO_SECRET with this value:</text><rect x="972" y="280" width="212" height="40" rx="6" fill="#f1f2f4"/><text x="1078" y="305.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#172b4d" text-anchor="middle">Reveal signing secret</text><text x="972" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#172b4d" text-anchor="start">2.  Commit this file as .forgejo/workflows/jira.yml, then put your</text><text x="972" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#172b4d" text-anchor="start">own deployment steps between the two reporting steps:</text><rect x="972" y="408" width="616" height="292" rx="10" fill="#0f172a"/><rect x="972" y="607" width="616" height="28" fill="#ff6600" opacity="0.16"/><rect x="972" y="659" width="616" height="28" fill="#ff6600" opacity="0.16"/><text x="996" y="444" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve" style="white-space:pre"><tspan fill="#e2e8f0"></tspan><tspan fill="#7dd3fc">name:</tspan><tspan fill="#fdba74"> Deploy</tspan></text><text x="996" y="470" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve" style="white-space:pre"><tspan fill="#e2e8f0"></tspan><tspan fill="#7dd3fc">on:</tspan></text><text x="996" y="496" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve" style="white-space:pre"><tspan fill="#e2e8f0">  </tspan><tspan fill="#7dd3fc">push:</tspan></text><text x="996" y="522" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve" style="white-space:pre"><tspan fill="#e2e8f0">    </tspan><tspan fill="#7dd3fc">branches:</tspan><tspan fill="#fdba74"> [main]</tspan></text><text x="996" y="548" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve" style="white-space:pre"><tspan fill="#e2e8f0"></tspan><tspan fill="#7dd3fc">jobs:</tspan></text><text x="996" y="574" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve" style="white-space:pre"><tspan fill="#e2e8f0">  </tspan><tspan fill="#7dd3fc">deploy:</tspan></text><text x="996" y="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve" style="white-space:pre"><tspan fill="#e2e8f0">    </tspan><tspan fill="#7dd3fc">steps:</tspan></text><text x="996" y="626" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve" style="white-space:pre"><tspan fill="#e2e8f0">      - </tspan><tspan fill="#7dd3fc">name:</tspan><tspan fill="#fdba74"> Tell Jira the deployment started</tspan></text><text x="996" y="652" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve" style="white-space:pre"><tspan fill="#7384a6">      # ---- your own deployment steps go here ----</tspan></text><text x="996" y="678" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve" style="white-space:pre"><tspan fill="#e2e8f0">      - </tspan><tspan fill="#7dd3fc">name:</tspan><tspan fill="#fdba74"> Tell Jira how the deployment ended</tspan></text><rect x="1492" y="720" width="96" height="42" rx="6" fill="#0c66e4"/><text x="1540" y="746.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Done</text></svg>