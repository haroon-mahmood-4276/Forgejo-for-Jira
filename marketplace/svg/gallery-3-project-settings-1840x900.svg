<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="900" viewBox="0 0 1840 900"><defs>
  <filter id="shadow-lg" x="-15%" y="-15%" width="130%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#172b4d" flood-opacity="0.16"/>
  </filter>
  <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172b4d" flood-opacity="0.12"/>
  </filter>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7f9fd"/>
    <stop offset="1" stop-color="#e9eff9"/>
  </linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0e1a33"/>
    <stop offset="1" stop-color="#1a2c55"/>
  </linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#ffe9d6"/>
  </linearGradient>
  <radialGradient id="glow-orange">
    <stop offset="0" stop-color="#ff6600" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-blue">
    <stop offset="0" stop-color="#0c66e4" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#0c66e4" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#c4cde0"/>
  </pattern>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1 1 L9 5 L1 9 z" fill="#5b6b86"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1 1 L9 5 L1 9 z" fill="#ff6600"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M1 1 L9 5 L1 9 z" fill="#0c66e4"/>
  </marker>
</defs><rect x="0" y="0" width="1840" height="900" fill="url(#canvas)"/><rect x="0" y="0" width="1840" height="900" fill="url(#dots)" opacity="0.55"/><circle cx="184" cy="108" r="420" fill="url(#glow-orange)" /><circle cx="1692.8000000000002" cy="855" r="460" fill="url(#glow-blue)" /><rect x="170" y="56" width="1500" height="788" rx="18" fill="#ffffff" stroke="#dfe3ec" stroke-width="1" filter="url(#shadow-lg)"/><clipPath id="project-window"><rect x="170" y="56" width="1500" height="788" rx="18"/></clipPath><g clip-path="url(#project-window)"><rect x="170" y="56" width="1500" height="52" fill="#f4f6fa"/><line x1="170" y1="108" x2="1670" y2="108" stroke="#dfe3ec" stroke-width="1" /><circle cx="198" cy="82" r="7" fill="#ff5f57" /><circle cx="222" cy="82" r="7" fill="#febc2e" /><circle cx="246" cy="82" r="7" fill="#28c840" /><rect x="280" y="67" width="1280" height="30" rx="15" fill="#ffffff" stroke="#dfe3ec" stroke-width="1"/><g transform="translate(298 74) scale(0.625)" fill="none" stroke="#8c9bb5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="324" y="87" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5b6b86" text-anchor="start">acme.atlassian.net/jira/software/projects/ABC/settings</text><rect x="170" y="108" width="250" height="736" fill="#f7f8fa"/><line x1="420" y1="108" x2="420" y2="844" stroke="#dfe3ec" stroke-width="1" /><rect x="194" y="138" width="40" height="40" rx="8" fill="#ff6600"/><text x="214" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">A</text><text x="248" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#172b4d" text-anchor="start">Acme Web</text><text x="248" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b86" text-anchor="start">Software project</text><text x="202" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6b86" text-anchor="start">Details</text><text x="202" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6b86" text-anchor="start">Access</text><text x="202" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6b86" text-anchor="start">Issue types</text><text x="202" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6b86" text-anchor="start">Workflows</text><rect x="182" y="412" width="226" height="40" rx="6" fill="#e9f2ff"/><rect x="182" y="412" width="3" height="40" fill="#0c66e4"/><text x="202" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0c66e4" text-anchor="start">Forgejo</text><text x="468" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">Forgejo</text><rect x="468" y="198" width="1154" height="296" rx="10" fill="#e9f2ff"/><rect x="468" y="198" width="4" height="296" fill="#0c66e4"/><g transform="translate(492 220) scale(1.1666666666666667)" fill="none" stroke="#0c66e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 6v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g><text x="536" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#172b4d" text-anchor="start">How your work reaches this project</text><text x="504" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#172b4d" text-anchor="start">Anything naming an issue key from this project is linked automatically.</text><text x="504" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#172b4d" text-anchor="start">Nothing has to be configured per project.</text><circle cx="504" cy="357" r="3" fill="#172b4d" /><text x="520" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#172b4d" xml:space="preserve" style="white-space:pre"><tspan font-weight="700">Branches</tspan><tspan> — name the branch after the issue, for example </tspan><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#42526e">ABC-123-short-description</tspan><tspan>.</tspan></text><circle cx="504" cy="391" r="3" fill="#172b4d" /><text x="520" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#172b4d" xml:space="preserve" style="white-space:pre"><tspan font-weight="700">Commits</tspan><tspan> — put the key in the commit message, for example </tspan><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#42526e">ABC-123 fix the redirect loop</tspan><tspan>.</tspan></text><circle cx="504" cy="425" r="3" fill="#172b4d" /><text x="520" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#172b4d" xml:space="preserve" style="white-space:pre"><tspan font-weight="700">Pull requests</tspan><tspan> — the key can be in the title or the source branch name.</tspan></text><text x="504" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#172b4d" text-anchor="start">Work with no issue key is ignored, and commits never move an issue through your workflow on their own.</text><text x="468" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#172b4d" text-anchor="start">Connected instances</text><rect x="468" y="560" width="1154" height="64" rx="10" fill="#ffffff" stroke="#dfe3ec" stroke-width="1"/><image x="488" y="576" width="32" height="32" href="data:image/svg+xml;base64,"/><text x="536" y="599" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#172b4d" text-anchor="start">Acme Forgejo</text><text x="671" y="599" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#5b6b86" text-anchor="start">code.acme.dev</text><rect x="1499" y="577" width="103" height="22" rx="4" fill="#dcfff1"/><text x="1507" y="592.32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#216e4e" text-anchor="start" letter-spacing="0.3">AUTHORIZED</text><text x="468" y="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#172b4d" text-anchor="start">Repositories feeding this site</text><rect x="468" y="698" width="1154" height="116" rx="10" fill="#ffffff" stroke="#dfe3ec" stroke-width="1"/><line x1="468" y1="756" x2="1622" y2="756" stroke="#eef1f6" stroke-width="1" /><text x="492" y="734" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">acme/api</text><rect x="1516" y="713" width="86" height="22" rx="4" fill="#dcfff1"/><text x="1524" y="728.32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#216e4e" text-anchor="start" letter-spacing="0.3">COMPLETE</text><text x="492" y="792" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">acme/web</text><rect x="1516" y="771" width="86" height="22" rx="4" fill="#dcfff1"/><text x="1524" y="786.32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#216e4e" text-anchor="start" letter-spacing="0.3">COMPLETE</text></g></svg>